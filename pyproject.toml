[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gmsg"
version = "0.1.0"
description = "A small CLI for Google Messages for Web."
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
license = { text = "MIT" }
authors = [{ name = "Uncle LYHME" }]
keywords = ["google-messages", "sms", "cli", "automation", "messages-for-web"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
]
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gmsg = "gmsg.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
